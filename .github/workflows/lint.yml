name: lint

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  no-exec-of-message-content:
    name: Lock 5 — no exec of message content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ripgrep

      - name: Run lint — no exec of message content (Lock 5)
        run: bash scripts/lint-no-exec.sh

      - name: Run lint — SOUL.md structure
        run: bash scripts/lint-soul.sh
